name: Test, Package & Publish QGIS Plugin

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run automated tests and build tse_to_qgis.zip
        run: python test_and_package.py

      - name: Validate official QGIS Plugin Repository compliance
        run: python upload_to_qgis_hub.py --validate-only

      - name: Upload tse_to_qgis.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: tse_to_qgis.zip
          path: tse_to_qgis.zip

      - name: Attach ZIP to GitHub Release (on tag push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tse_to_qgis.zip
          generate_release_notes: true

      - name: Publish automatically to plugins.qgis.org (if QGIS_PLUGIN_TOKEN is configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.QGIS_PLUGIN_TOKEN != ''
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: python upload_to_qgis_hub.py --token "$QGIS_PLUGIN_TOKEN"
